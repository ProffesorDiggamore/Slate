# Netlify builds only the app in /app. Your notes are never part of the website.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  # Build every push to main. (An old rule skipped builds when app/ hadn't
  # changed since the last build — but a deploy-preview build counts as "last",
  # so merged pull requests were skipped. Notes live in their own repo now, so
  # there's nothing to skip.)

[build.environment]
  NODE_VERSION = "22"

# Let installed copies find app updates right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Privacy lock. The site is only the app: every visitor's notes live in their own
# browser and their own GitHub repo. This policy makes the browser refuse to send
# anything anywhere else — GitHub's API, and Google's Calendar API only for people
# who connect it. No analytics, no ads, no third-party scripts, no inline scripts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://www.googleapis.com https://oauth2.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
